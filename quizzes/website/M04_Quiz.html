<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M04 Quiz, LangChain & the Beer Game</title>
<!--
  DADS 5250 Module Quiz, M04: LangChain & the Beer Game  (Student quiz)
  SELF-CONTAINED: this single .html file needs no other files (it only loads the Outfit web font from Google).
  HOW TO ADD IT TO THE WEBSITE, pick one:
    1) Upload this file and embed it:  <iframe src="M04_Quiz.html" style="width:100%;height:940px;border:0"></iframe>
    2) Or link to it directly from the module page.
  Two versions exist per module: M04_Quiz.html (student, answers hidden) and M04_Review.html (answer key, answers shown).
  Everything runs in the browser. No data is sent anywhere; the student's answers stay on their device.
-->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* DADS 5250 quiz engine, Liquid Glass theme (lifted from the IE3425 quiz component). */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F0F4FA;
  --accent-blue: #2563EB;
  --glass-bg: rgba(255,255,255,0.45);
  --glass-border: rgba(255,255,255,0.55);
  --glass-shadow: 0 8px 32px rgba(37,99,235,0.08);
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-warm: #64748b;
  --correct: #059669;
  --correct-bg: rgba(34,197,94,0.10);
  --correct-border: rgba(34,197,94,0.35);
  --incorrect: #dc2626;
  --incorrect-bg: rgba(239,68,68,0.09);
  --incorrect-border: rgba(239,68,68,0.32);
  --blue-light: rgba(37,99,235,0.08);
  --blue-medium: rgba(37,99,235,0.12);
  --radius: 20px;
  --radius-sm: 12px;
}

body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  font-weight: 400;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top: -120px; right: -120px; width: 400px; height: 400px;
  border-radius: 50%; background: radial-gradient(circle, rgba(37,99,235,0.07) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.container { max-width: 780px; margin: 0 auto; padding: 32px 24px 72px; position: relative; z-index: 1; }

.quiz-header { text-align: center; margin-bottom: 28px; }
.quiz-header .eyebrow { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent-blue); }
.quiz-header h1 { font-size: 1.75rem; font-weight: 700; margin: 6px 0 4px; }
.quiz-header .subtitle { font-size: 0.95rem; color: var(--text-secondary); }

.review-banner {
  background: rgba(37,99,235,0.10); border: 1px solid rgba(37,99,235,0.28); color: #1e3a8a;
  border-radius: var(--radius-sm); padding: 12px 18px; margin-bottom: 24px; font-weight: 600; font-size: 0.95rem; text-align: center;
}

.score-bar {
  display: flex; align-items: center; justify-content: space-between; background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 14px 24px; margin-bottom: 24px; box-shadow: var(--glass-shadow);
}
.score-bar .score-text { font-weight: 600; font-size: 1rem; }
.score-bar .page-indicator { font-weight: 400; font-size: 0.9rem; color: var(--text-secondary); }

.progress-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
.progress-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(37,99,235,0.15); transition: all 0.3s ease; cursor: pointer; }
.progress-dot.active { background: var(--accent-blue); box-shadow: 0 0 8px rgba(37,99,235,0.35); transform: scale(1.25); }
.progress-dot.correct { background: rgba(34,197,94,0.75); }
.progress-dot.incorrect { background: rgba(239,68,68,0.72); }

.question-card {
  background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 34px 32px;
  box-shadow: var(--glass-shadow); margin-bottom: 22px; animation: fadeIn 0.35s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.qmeta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.question-number { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-blue); }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--blue-medium); color: var(--accent-blue); letter-spacing: 0.03em; }
.badge.diff-easy { background: rgba(34,197,94,0.14); color: #047857; }
.badge.diff-medium { background: rgba(234,179,8,0.16); color: #a16207; }
.badge.diff-hard { background: rgba(239,68,68,0.14); color: #b91c1c; }

.question-prompt { font-size: 1.15rem; font-weight: 500; line-height: 1.55; margin-bottom: 20px; }
.hint { font-size: 0.86rem; color: var(--text-warm); margin-bottom: 18px; }

.diagram-area { display: flex; justify-content: center; margin-bottom: 22px; padding: 16px; background: rgba(255,255,255,0.4); border: 1px solid rgba(37,99,235,0.08); border-radius: 14px; }
.diagram-area svg { max-width: 100%; height: auto; }

.code-block {
  font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 0.9rem; line-height: 1.6;
  background: #0f172a; color: #e2e8f0; border-radius: var(--radius-sm); padding: 18px 20px; margin-bottom: 20px;
  overflow-x: auto; white-space: pre; border: 1px solid rgba(148,163,184,0.25);
}
.code-block .cm { color: #64748b; }

.options-list { display: flex; flex-direction: column; gap: 12px; }
.option {
  display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(37,99,235,0.12); border-radius: 14px;
  padding: 15px 18px; font-size: 1rem; font-family: inherit; color: var(--text-primary);
  cursor: pointer; transition: all 0.25s ease;
}
.option:hover:not(.locked) { border-color: rgba(37,99,235,0.35); background: rgba(37,99,235,0.06); }
.option .letter { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; background: var(--blue-light); color: var(--accent-blue); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }
.option.selected { border-color: rgba(37,99,235,0.5); background: rgba(37,99,235,0.10); }
.option.correct { background: var(--correct-bg); border-color: var(--correct-border); }
.option.correct .letter { background: rgba(34,197,94,0.2); color: var(--correct); }
.option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); }
.option.incorrect .letter { background: rgba(239,68,68,0.18); color: var(--incorrect); }
.option.locked { cursor: default; }
.option .mark { margin-left: auto; font-weight: 700; }
.option.correct .mark { color: var(--correct); }
.option.incorrect .mark { color: var(--incorrect); }

.fill-input { width: 100%; font-family: inherit; font-size: 1rem; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(37,99,235,0.2); background: rgba(255,255,255,0.6); color: var(--text-primary); }
.order-list { display: flex; flex-direction: column; gap: 10px; }
.order-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(37,99,235,0.12); border-radius: 12px; padding: 12px 16px; }
.order-item .num { width: 24px; height: 24px; border-radius: 6px; background: var(--blue-light); color: var(--accent-blue); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
.order-item select { margin-left: auto; font-family: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(37,99,235,0.2); background: #fff; }

.btn { font-family: inherit; font-weight: 600; font-size: 0.95rem; padding: 11px 22px; border-radius: 12px; border: 1px solid rgba(37,99,235,0.25); background: rgba(37,99,235,0.1); color: var(--accent-blue); cursor: pointer; transition: all 0.2s ease; }
.btn:hover { background: rgba(37,99,235,0.18); }
.btn.primary { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
.btn:disabled { opacity: 0.45; cursor: default; }
.submit-row { margin-top: 20px; display: flex; gap: 12px; }

.feedback { margin-top: 20px; padding: 16px 18px; border-radius: 14px; font-size: 0.98rem; line-height: 1.55; display: none; }
.feedback.show { display: block; animation: fadeIn 0.3s ease; }
.feedback.correct { background: var(--correct-bg); border-left: 4px solid var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); border-left: 4px solid var(--incorrect); }
.feedback .verdict { font-weight: 700; }
.feedback.correct .verdict { color: var(--correct); }
.feedback.incorrect .verdict { color: var(--incorrect); }
.feedback .answer-line { margin-top: 6px; }

.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

/* Review mode: everything visible, stacked */
.rev-answer { margin-top: 8px; font-size: 0.95rem; }
.rev-answer .lbl { font-weight: 700; color: var(--correct); }
.rev-exp { margin-top: 10px; padding: 14px 16px; background: rgba(37,99,235,0.06); border-left: 4px solid var(--accent-blue); border-radius: 10px; font-size: 0.94rem; }
.rev-exp .opt-exp { margin: 4px 0; }
.rev-exp .opt-exp .ol { font-weight: 700; }

</style>
</head>
<body>
<div class="container">
  <div class="quiz-header" id="quiz-header"></div>
  <div id="quiz-root"></div>
</div>
<script>
window.QUIZ = {
  meta: { module: "M04", title: "LangChain & the Beer Game", subtitle: "DADS 5250 Generative AI in Practice" },
  questions: [
    {
      id: 1,
      difficulty: "easy",
      type: "mc",
      typeLabel: "Multiple choice",
      prompt: "According to Module 4, what are the <strong>four core building blocks</strong> of LangChain?",
      options: [
        { letter: "A", text: "LLMs, Prompt Templates, Memory, and Chains", explanation: "Correct: the module names LLMs, Prompt Templates, Memory, and Chains as the four building blocks that LCEL connects together." },
        { letter: "B", text: "Embeddings, Vector Stores, Retrievers, and Rerankers", explanation: "These are components of a RAG pipeline, not the four LangChain building blocks. RAG and retrieval are covered in the next module, whereas Module 4 focuses on LLMs, Prompt Templates, Memory, and Chains." },
        { letter: "C", text: "Agents, Tools, Planners, and Executors", explanation: "These terms belong to agentic frameworks like LangGraph, not the foundational blocks taught here. Module 4's four blocks are LLMs, Prompt Templates, Memory, and Chains." },
        { letter: "D", text: "Tokens, Weights, Layers, and Gradients", explanation: "These describe the internals of a neural network, not LangChain's application-level components. LangChain composes LLMs, Prompt Templates, Memory, and Chains rather than exposing model internals." }
      ],
      correctIndex: 0
    },
    {
      id: 2,
      difficulty: "medium",
      type: "order",
      typeLabel: "Ordering",
      prompt: "Order the stages of a basic LCEL chain so that data flows correctly from a user's question to a clean answer, as shown in <em>Building Your First Chain</em>.",
      items: [
        "The LLM generates a raw response",
        "The user asks a question",
        "The output parser extracts the clean text",
        "The prompt template wraps the input with structure and context"
      ],
      correctOrder: [2, 0, 3, 1],
      explanation: "The correct sequence is: the user asks a question, the prompt template wraps it with structure and context, the LLM generates a raw response, then the output parser extracts the clean text. This mirrors the LCEL pipeline prompt | llm | output_parser, where each step's output becomes the next step's input."
    },
    {
      id: 3,
      difficulty: "medium",
      type: "mc",
      typeLabel: "Practical insight",
      prompt: "In LangChain's unified interface, you swap from <code>ChatOpenAI</code> to <code>ChatGoogleGenerativeAI</code>. What is the main practical benefit the module highlights?",
      options: [
        { letter: "A", text: "You change providers in essentially one line without rewriting the rest of the application", explanation: "Correct: the unified interface means the same code sends identical messages to different providers, so you swap models in one line without rewriting the pipeline." },
        { letter: "B", text: "The two models will now always return identical answers", explanation: "Different providers produce different outputs even with the same input, so identical answers are not guaranteed. The benefit is code portability, not response equivalence: the same code runs on either model, but each still reasons and phrases things differently." },
        { letter: "C", text: "Memory is automatically shared across both providers with no extra setup", explanation: "Swapping the LLM does not by itself wire up memory; LLMs are stateless by default and memory is a separate building block you add. The unified interface only standardizes how you call any model, not conversation state." },
        { letter: "D", text: "It removes the need for prompt templates entirely", explanation: "Prompt templates and the model interface are independent building blocks, so changing the model does not eliminate templates. Templates still provide reusable, variable-filled prompts regardless of which provider you call." }
      ],

    },
    {

      type: "mc",
      typeLabel: "Multiple choice",
      prompt: "In the Beer Game, what is the <strong>bullwhip effect</strong> that emerges over the simulation?",
      options: [
        { letter: "A", text: "Small changes in customer demand amplify into progressively larger order swings upstream toward the factory", explanation: "Correct: because each role reacts to the order below it (with delays), small demand changes grow into massive swings as you move up toward the factory." },
        { letter: "B", text: "Orders shrink steadily at each stage until the factory produces almost nothing", explanation: "The bullwhip effect amplifies rather than dampens variation, so orders swing wider upstream, not smaller. Demand distortion grows toward the factory, which is the opposite of a steady shrink." },
        { letter: "C", text: "The retailer and factory always place exactly the same order every week", explanation: "Identical, stable orders would mean no bullwhip at all, yet the whole point of the simulation is that upstream orders become more volatile. Delays and overreaction make the factory's orders swing far more than the retailer's." },
        { letter: "D", text: "Holding cost is eliminated once the AI agents coordinate their orders", explanation: "The bullwhip effect describes demand amplification, not the removal of holding cost, and the simulation still tracks holding and backorder costs throughout. Coordination might reduce swings, but the effect itself is about amplified variability, not cost elimination." }
      ],

      code: "roles = [\"Retailer\", \"Wholesaler\", \"Distributor\", \"Factory\"]\norder = 4\nfor role in roles:\n    order = order + 2\n    print(role, order)",
      options: [
        { letter: "A", text: "Retailer 6 / Wholesaler 8 / Distributor 10 / Factory 12", explanation: "Correct: order starts at 4 and gains 2 before each print, producing Retailer 6, Wholesaler 8, Distributor 10, Factory 12 (one line each)." },
        { letter: "B", text: "Retailer 4 / Wholesaler 6 / Distributor 8 / Factory 10", explanation: "This assumes the print happens before the addition, but order = order + 2 runs first each iteration. The Retailer therefore prints 6, not 4, and every line is 2 higher than shown." },
        { letter: "C", text: "Retailer 6 / Wholesaler 6 / Distributor 6 / Factory 6", explanation: "This treats order as if it reset to 4 each loop, but order is defined once outside the loop and carries its value forward. Because it accumulates, the amount grows by 2 at every stage instead of staying constant." },
        { letter: "D", text: "Factory 12 / Distributor 10 / Wholesaler 8 / Retailer 6", explanation: "The list is iterated in its written order, Retailer first, so the output is not reversed. The values are right but the roles print top to bottom starting with Retailer." }

};

window.REVIEW = false;

<script>
/* DADS 5250 quiz engine. Reads window.QUIZ = {meta, questions} and window.REVIEW (bool).
   Student mode: ALL questions on one scrolling page, each answered inline with instant feedback.
   Review mode: all questions with correct answers and every explanation shown.
   Mechanics: mc, multi, tf, fill, order. Any question may carry a `code` block or `diagram` (SVG). */
(function () {
  var Q = window.QUIZ || { meta: {}, questions: [] };
  var REVIEW = !!window.REVIEW;
  var questions = Q.questions || [];
  var meta = Q.meta || {};
  var STORAGE_KEY = 'dads_quiz_' + (meta.module || 'x');
  var state = { answers: questions.map(function () { return { answered: false, correct: false }; }) };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return String(s).trim().toLowerCase().replace(/[^a-z0-9.]/g, ''); }
  function root() { return document.getElementById('quiz-root'); }
  function card(i) { return document.getElementById('qc-' + i); }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
  function load() { try { var s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s && s.answers && s.answers.length === questions.length) state = s; } catch (e) {} }
  function diffLabel(d) { return d ? d.charAt(0).toUpperCase() + d.slice(1) : 'Medium'; }
  function score() { return state.answers.filter(function (a) { return a.correct; }).length; }
  function answered() { return state.answers.filter(function (a) { return a.answered; }).length; }
  function visuals(q) {
    var h = '';
    if (q.diagram) h += '<div class="diagram-area">' + q.diagram + '</div>';
    if (q.code) h += '<div class="code-block">' + esc(q.code) + '</div>';
    return h;
  }
  function metaRow(q, i) {
    return '<div class="qmeta"><span class="question-number">Question ' + (i + 1) + '</span>' +
      '<span class="badge">' + esc(q.typeLabel || 'Multiple choice') + '</span>' +
      '<span class="badge diff-' + (q.difficulty || 'medium') + '">' + diffLabel(q.difficulty) + '</span></div>';
  }

  /* ---------- one interactive question card (student mode) ---------- */
  function studentCard(q, i) {
    var body = metaRow(q, i) + '<div class="question-prompt">' + q.prompt + '</div>' + visuals(q);
    if (q.type === 'mc' || q.type === 'multi') {
      body += '<div class="options-list">' + q.options.map(function (o, j) {
        return '<button class="option" data-i="' + j + '"><span class="letter">' + o.letter + '</span><span>' + o.text + '</span><span class="mark"></span></button>';
      }).join('') + '</div>';
      if (q.type === 'multi') body += '<div class="submit-row"><button class="btn primary" data-submit>Submit</button><span class="hint" style="margin:0;align-self:center">Select all that apply.</span></div>';
    } else if (q.type === 'tf') {
      body += '<div class="options-list"><button class="option" data-tf="true"><span class="letter">T</span><span>True</span><span class="mark"></span></button>' +
              '<button class="option" data-tf="false"><span class="letter">F</span><span>False</span><span class="mark"></span></button></div>';
    } else if (q.type === 'fill') {
      body += '<input class="fill-input" data-fill placeholder="Type your answer" autocomplete="off"><div class="submit-row"><button class="btn primary" data-submit>Submit</button></div>';
    } else if (q.type === 'order') {
      body += '<div class="order-list">' + q.items.map(function (it, k) {
        var opts = q.items.map(function (_, j) { return '<option value="' + j + '">' + (j + 1) + '</option>'; }).join('');
        return '<div class="order-item"><span class="num">' + (k + 1) + '</span><span>' + esc(it) + '</span><select data-oi="' + k + '">' + opts + '</select></div>';
      }).join('') + '</div><div class="submit-row"><button class="btn primary" data-submit>Submit</button><span class="hint" style="margin:0;align-self:center">Set the correct position for each item.</span></div>';
    }
    body += '<div class="feedback"></div>';
    return body;
  }

  function renderStudent() {
    var r = root();
    var head = '<div class="score-bar"><span class="score-text">' + score() + ' / ' + questions.length + ' correct</span>' +
      '<span class="page-indicator" id="prog">' + answered() + ' of ' + questions.length + ' answered</span></div>';
    r.innerHTML = head + questions.map(function (q, i) { return '<div class="question-card" id="qc-' + i + '">' + studentCard(q, i) + '</div>'; }).join('');
    questions.forEach(function (q, i) { wire(q, i); if (state.answers[i].answered) replay(q, i); });
  }

  function updateBars() {
    var st = document.querySelector('.score-text'); if (st) st.textContent = score() + ' / ' + questions.length + ' correct';
    var pr = document.getElementById('prog'); if (pr) pr.textContent = answered() + ' of ' + questions.length + ' answered';
  }

  function wire(q, i) {
    if (state.answers[i].answered) return;
    var c = card(i);
    if (q.type === 'mc') {
      c.querySelectorAll('.option').forEach(function (b) { b.onclick = function () { gradeMC(q, i, +b.getAttribute('data-i')); }; });
    } else if (q.type === 'tf') {
      c.querySelectorAll('.option').forEach(function (b) { b.onclick = function () { gradeTF(q, i, b.getAttribute('data-tf') === 'true'); }; });
    } else if (q.type === 'multi') {
      c.querySelectorAll('.option').forEach(function (b) { b.onclick = function () { b.classList.toggle('selected'); }; });
      c.querySelector('[data-submit]').onclick = function () {
        var chosen = []; c.querySelectorAll('.option.selected').forEach(function (b) { chosen.push(+b.getAttribute('data-i')); });
        gradeMulti(q, i, chosen);
      };
    } else if (q.type === 'fill') {
      c.querySelector('[data-submit]').onclick = function () { gradeFill(q, i, c.querySelector('[data-fill]').value); };
    } else if (q.type === 'order') {
      c.querySelector('[data-submit]').onclick = function () {
        var ord = []; c.querySelectorAll('[data-oi]').forEach(function (s) { ord[+s.getAttribute('data-oi')] = +s.value; });
        gradeOrder(q, i, ord);
      };
    }
  }

  function lockAndFeedback(q, i, correct, answerHTML, exp) {
    var c = card(i);
    c.querySelectorAll('.option').forEach(function (b) { b.classList.add('locked'); });
    var sub = c.querySelector('[data-submit]'); if (sub) sub.disabled = true;
    var fill = c.querySelector('[data-fill]'); if (fill) fill.disabled = true;
    var fb = c.querySelector('.feedback');
    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
    fb.innerHTML = '<span class="verdict">' + (correct ? 'Correct.' : 'Not quite.') + '</span>' +
      (answerHTML ? '<div class="answer-line">' + answerHTML + '</div>' : '') +
      (exp ? '<div class="answer-line">' + exp + '</div>' : '');
    state.answers[i] = { answered: true, correct: correct };
    save(); updateBars();
  }

  function gradeMC(q, i, sel) {
    var correct = sel === q.correctIndex, opts = card(i).querySelectorAll('.option');
    opts[sel].classList.add(correct ? 'correct' : 'incorrect');
    opts[sel].querySelector('.mark').textContent = correct ? '✓' : '✗';
    if (!correct) { opts[q.correctIndex].classList.add('correct'); opts[q.correctIndex].querySelector('.mark').textContent = '✓'; }
    var co = q.options[q.correctIndex], ch = q.options[sel];
    var exp = correct ? co.explanation
      : '<strong>Why ' + ch.letter + ' is wrong:</strong> ' + ch.explanation +
        '<div class="answer-line"><strong>Why ' + co.letter + ' is right:</strong> ' + co.explanation + '</div>';
    lockAndFeedback(q, i, correct, '<strong>Answer:</strong> ' + co.letter + ') ' + co.text, exp);
  }
  function gradeMulti(q, i, chosen) {
    var correct = q.correctIndices.slice().sort().join(',') === chosen.slice().sort().join(',');
    var opts = card(i).querySelectorAll('.option');
    q.correctIndices.forEach(function (ci) { opts[ci].classList.add('correct'); opts[ci].querySelector('.mark').textContent = '✓'; });
    chosen.forEach(function (ci) { if (q.correctIndices.indexOf(ci) < 0) { opts[ci].classList.add('incorrect'); opts[ci].querySelector('.mark').textContent = '✗'; } });
    var letters = q.correctIndices.map(function (ci) { return q.options[ci].letter; }).join(', ');
    var exp;
    if (correct) { exp = q.explanation || ''; }
    else {
      var parts = [];
      chosen.forEach(function (ci) { if (q.correctIndices.indexOf(ci) < 0) parts.push('<div class="answer-line"><strong>' + q.options[ci].letter + ' should NOT be selected:</strong> ' + q.options[ci].explanation + '</div>'); });
      q.correctIndices.forEach(function (ci) { if (chosen.indexOf(ci) < 0) parts.push('<div class="answer-line"><strong>' + q.options[ci].letter + ' should be selected:</strong> ' + q.options[ci].explanation + '</div>'); });
      exp = parts.join('') + (q.explanation ? '<div class="answer-line">' + q.explanation + '</div>' : '');
    }
    lockAndFeedback(q, i, correct, '<strong>Correct set:</strong> ' + letters, exp);
  }
  function gradeTF(q, i, val) {
    var correct = val === q.correctAnswer, opts = card(i).querySelectorAll('.option');
    var sidx = val ? 0 : 1, cidx = q.correctAnswer ? 0 : 1;
    opts[sidx].classList.add(correct ? 'correct' : 'incorrect');
    opts[sidx].querySelector('.mark').textContent = correct ? '✓' : '✗';
    if (!correct) { opts[cidx].classList.add('correct'); opts[cidx].querySelector('.mark').textContent = '✓'; }
    lockAndFeedback(q, i, correct, '<strong>Answer:</strong> ' + (q.correctAnswer ? 'True' : 'False'), q.explanation);
  }
  function gradeFill(q, i, val) {
    var correct = (q.accept || []).some(function (a) { return norm(a) === norm(val); });
    lockAndFeedback(q, i, correct, '<strong>Answer:</strong> ' + esc(q.accept[0]), q.explanation);
  }
  function gradeOrder(q, i, ord) {
    var correct = ord.join(',') === q.correctOrder.join(',');
    var ordered = q.items.map(function (_, slot) { var itemIdx = q.correctOrder.indexOf(slot); return (slot + 1) + '. ' + esc(q.items[itemIdx]); }).join('<br>');
    lockAndFeedback(q, i, correct, '<strong>Correct order:</strong><br>' + ordered, q.explanation);
  }

  function replay(q, i) {
    var c = card(i);
    if (q.type === 'mc' || q.type === 'tf') {
      var opts = c.querySelectorAll('.option');
      var cidx = q.type === 'mc' ? q.correctIndex : (q.correctAnswer ? 0 : 1);
      if (opts[cidx]) { opts[cidx].classList.add('correct'); opts[cidx].querySelector('.mark').textContent = '✓'; }
    }
    c.querySelectorAll('.option').forEach(function (b) { b.classList.add('locked'); });
    var sub = c.querySelector('[data-submit]'); if (sub) sub.disabled = true;
    var fill = c.querySelector('[data-fill]'); if (fill) fill.disabled = true;
    var fb = c.querySelector('.feedback');
    fb.className = 'feedback show ' + (state.answers[i].correct ? 'correct' : 'incorrect');
    fb.innerHTML = '<span class="verdict">' + (state.answers[i].correct ? 'Correct.' : 'Not quite.') + '</span> <span class="answer-line">You have already answered this question. Clear your browser storage to retake it.</span>';
  }

  /* ---------- REVIEW / ANSWER-KEY MODE ---------- */
  function renderReview() {
    var r = root();
    var html = '<div class="review-banner">Colleague review view. Correct answers and explanations are shown. This is not the student view.</div>';
    questions.forEach(function (q, i) {
      html += '<div class="question-card">' + metaRow(q, i) + '<div class="question-prompt">' + q.prompt + '</div>' + visuals(q);
      if (q.type === 'mc' || q.type === 'multi') {
        var correctSet = q.type === 'mc' ? [q.correctIndex] : q.correctIndices;
        html += '<div class="options-list">' + q.options.map(function (o, j) {
          var isC = correctSet.indexOf(j) >= 0;
          return '<div class="option locked' + (isC ? ' correct' : '') + '"><span class="letter">' + o.letter + '</span><span>' + o.text + '</span><span class="mark">' + (isC ? '✓' : '') + '</span></div>';
        }).join('') + '</div>';
        html += '<div class="rev-exp">' + q.options.map(function (o) { return '<div class="opt-exp"><span class="ol">' + o.letter + ')</span> ' + (o.explanation || '') + '</div>'; }).join('') + '</div>';
      } else if (q.type === 'tf') {
        html += '<div class="rev-answer"><span class="lbl">Answer:</span> ' + (q.correctAnswer ? 'True' : 'False') + '</div><div class="rev-exp">' + q.explanation + '</div>';
      } else if (q.type === 'fill') {
        html += '<div class="rev-answer"><span class="lbl">Answer:</span> ' + esc(q.accept.join(' / ')) + '</div><div class="rev-exp">' + q.explanation + '</div>';
      } else if (q.type === 'order') {
        var ordered = q.items.map(function (_, slot) { var itemIdx = q.correctOrder.indexOf(slot); return (slot + 1) + '. ' + esc(q.items[itemIdx]); }).join('<br>');
        html += '<div class="rev-answer"><span class="lbl">Correct order:</span><br>' + ordered + '</div><div class="rev-exp">' + q.explanation + '</div>';
      }
      html += '</div>';
    });
    r.innerHTML = html;
  }

  function boot() {
    var hdr = document.getElementById('quiz-header');
    if (hdr) hdr.innerHTML = '<div class="eyebrow">' + esc(meta.module || '') + ' quiz</div><h1>' + esc(meta.title || 'Module quiz') + '</h1><div class="subtitle">' + esc(meta.subtitle || 'DADS 5250 Generative AI in Practice') + '</div>';
    if (REVIEW) renderReview(); else { load(); renderStudent(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
