<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M05 Answer Key, Retrieval-Augmented Generation (RAG)</title>
<!--
  DADS 5250 Module Quiz, M05: Retrieval-Augmented Generation (RAG)  (Answer key (colleagues))
  SELF-CONTAINED: this single .html file needs no other files (it only loads the Outfit web font from Google).
  HOW TO ADD IT TO THE WEBSITE, pick one:
    1) Upload this file and embed it:  <iframe src="M05_Quiz.html" style="width:100%;height:940px;border:0"></iframe>
    2) Or link to it directly from the module page.
  Two versions exist per module: M05_Quiz.html (student, answers hidden) and M05_Review.html (answer key, answers shown).
  Everything runs in the browser. No data is sent anywhere; the student's answers stay on their device.
-->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* DADS 5250 quiz engine, Liquid Glass theme (lifted from the IE3425 quiz component). */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F0F4FA;
  --accent-blue: #2563EB;
  --glass-bg: rgba(255,255,255,0.45);
  --glass-border: rgba(255,255,255,0.55);
  --glass-shadow: 0 8px 32px rgba(37,99,235,0.08);
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-warm: #64748b;
  --correct: #059669;
  --correct-bg: rgba(34,197,94,0.10);
  --correct-border: rgba(34,197,94,0.35);
  --incorrect: #dc2626;
  --incorrect-bg: rgba(239,68,68,0.09);
  --incorrect-border: rgba(239,68,68,0.32);
  --blue-light: rgba(37,99,235,0.08);
  --blue-medium: rgba(37,99,235,0.12);
  --radius: 20px;
  --radius-sm: 12px;
}

body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  font-weight: 400;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top: -120px; right: -120px; width: 400px; height: 400px;
  border-radius: 50%; background: radial-gradient(circle, rgba(37,99,235,0.07) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.container { max-width: 780px; margin: 0 auto; padding: 32px 24px 72px; position: relative; z-index: 1; }

.quiz-header { text-align: center; margin-bottom: 28px; }
.quiz-header .eyebrow { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent-blue); }
.quiz-header h1 { font-size: 1.75rem; font-weight: 700; margin: 6px 0 4px; }
.quiz-header .subtitle { font-size: 0.95rem; color: var(--text-secondary); }

.review-banner {
  background: rgba(37,99,235,0.10); border: 1px solid rgba(37,99,235,0.28); color: #1e3a8a;
  border-radius: var(--radius-sm); padding: 12px 18px; margin-bottom: 24px; font-weight: 600; font-size: 0.95rem; text-align: center;
}

.score-bar {
  display: flex; align-items: center; justify-content: space-between; background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 14px 24px; margin-bottom: 24px; box-shadow: var(--glass-shadow);
}
.score-bar .score-text { font-weight: 600; font-size: 1rem; }
.score-bar .page-indicator { font-weight: 400; font-size: 0.9rem; color: var(--text-secondary); }

.progress-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
.progress-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(37,99,235,0.15); transition: all 0.3s ease; cursor: pointer; }
.progress-dot.active { background: var(--accent-blue); box-shadow: 0 0 8px rgba(37,99,235,0.35); transform: scale(1.25); }
.progress-dot.correct { background: rgba(34,197,94,0.75); }
.progress-dot.incorrect { background: rgba(239,68,68,0.72); }

.question-card {
  background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 34px 32px;
  box-shadow: var(--glass-shadow); margin-bottom: 22px; animation: fadeIn 0.35s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.qmeta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.question-number { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-blue); }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--blue-medium); color: var(--accent-blue); letter-spacing: 0.03em; }
.badge.diff-easy { background: rgba(34,197,94,0.14); color: #047857; }
.badge.diff-medium { background: rgba(234,179,8,0.16); color: #a16207; }
.badge.diff-hard { background: rgba(239,68,68,0.14); color: #b91c1c; }

.question-prompt { font-size: 1.15rem; font-weight: 500; line-height: 1.55; margin-bottom: 20px; }
.hint { font-size: 0.86rem; color: var(--text-warm); margin-bottom: 18px; }

.diagram-area { display: flex; justify-content: center; margin-bottom: 22px; padding: 16px; background: rgba(255,255,255,0.4); border: 1px solid rgba(37,99,235,0.08); border-radius: 14px; }
.diagram-area svg { max-width: 100%; height: auto; }

.code-block {
  font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 0.9rem; line-height: 1.6;
  background: #0f172a; color: #e2e8f0; border-radius: var(--radius-sm); padding: 18px 20px; margin-bottom: 20px;
  overflow-x: auto; white-space: pre; border: 1px solid rgba(148,163,184,0.25);
}
.code-block .cm { color: #64748b; }

.options-list { display: flex; flex-direction: column; gap: 12px; }
.option {
  display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(37,99,235,0.12); border-radius: 14px;
  padding: 15px 18px; font-size: 1rem; font-family: inherit; color: var(--text-primary);
  cursor: pointer; transition: all 0.25s ease;
}
.option:hover:not(.locked) { border-color: rgba(37,99,235,0.35); background: rgba(37,99,235,0.06); }
.option .letter { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; background: var(--blue-light); color: var(--accent-blue); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }
.option.selected { border-color: rgba(37,99,235,0.5); background: rgba(37,99,235,0.10); }
.option.correct { background: var(--correct-bg); border-color: var(--correct-border); }
.option.correct .letter { background: rgba(34,197,94,0.2); color: var(--correct); }
.option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); }
.option.incorrect .letter { background: rgba(239,68,68,0.18); color: var(--incorrect); }
.option.locked { cursor: default; }
.option .mark { margin-left: auto; font-weight: 700; }
.option.correct .mark { color: var(--correct); }
.option.incorrect .mark { color: var(--incorrect); }

.fill-input { width: 100%; font-family: inherit; font-size: 1rem; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(37,99,235,0.2); background: rgba(255,255,255,0.6); color: var(--text-primary); }
.order-list { display: flex; flex-direction: column; gap: 10px; }
.order-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(37,99,235,0.12); border-radius: 12px; padding: 12px 16px; }
.order-item .num { width: 24px; height: 24px; border-radius: 6px; background: var(--blue-light); color: var(--accent-blue); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
.order-item select { margin-left: auto; font-family: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(37,99,235,0.2); background: #fff; }

.btn { font-family: inherit; font-weight: 600; font-size: 0.95rem; padding: 11px 22px; border-radius: 12px; border: 1px solid rgba(37,99,235,0.25); background: rgba(37,99,235,0.1); color: var(--accent-blue); cursor: pointer; transition: all 0.2s ease; }
.btn:hover { background: rgba(37,99,235,0.18); }
.btn.primary { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
.btn:disabled { opacity: 0.45; cursor: default; }
.submit-row { margin-top: 20px; display: flex; gap: 12px; }

.feedback { margin-top: 20px; padding: 16px 18px; border-radius: 14px; font-size: 0.98rem; line-height: 1.55; display: none; }
.feedback.show { display: block; animation: fadeIn 0.3s ease; }
.feedback.correct { background: var(--correct-bg); border-left: 4px solid var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); border-left: 4px solid var(--incorrect); }
.feedback .verdict { font-weight: 700; }
.feedback.correct .verdict { color: var(--correct); }
.feedback.incorrect .verdict { color: var(--incorrect); }
.feedback .answer-line { margin-top: 6px; }

.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

/* Review mode: everything visible, stacked */
.rev-answer { margin-top: 8px; font-size: 0.95rem; }
.rev-answer .lbl { font-weight: 700; color: var(--correct); }
.rev-exp { margin-top: 10px; padding: 14px 16px; background: rgba(37,99,235,0.06); border-left: 4px solid var(--accent-blue); border-radius: 10px; font-size: 0.94rem; }
.rev-exp .opt-exp { margin: 4px 0; }
.rev-exp .opt-exp .ol { font-weight: 700; }

</style>
</head>
<body>
<div class="container">
  <div class="quiz-header" id="quiz-header"></div>
  <div id="quiz-root"></div>
</div>
<script>
window.QUIZ = {
  meta: {
    module: "M05",
    title: "Retrieval-Augmented Generation (RAG)",
    subtitle: "DADS 5250 Generative AI in Practice"
  },
  questions: [
    {
      id: "m05-q1",
      difficulty: "easy",
      type: "mc",
      typeLabel: "Multiple choice",
      prompt: "In this module, what core problem does RAG solve for large language models?",
      options: [
        {
          letter: "A",
          text: "Hallucination -- confident but factually wrong answers about data the model never saw",
          explanation: "Correct: RAG grounds the model in your actual documents so it retrieves real data before generating, instead of guessing."
        },
        {
          letter: "B",
          text: "The model is too slow, so RAG speeds up token generation",
          explanation: "This confuses RAG with an inference optimization. RAG actually adds a retrieval step before generation, so it does not make the model generate tokens faster; its purpose is accuracy and grounding, not speed."
        },
        {
          letter: "C",
          text: "The model cannot understand grammar, so RAG teaches it language rules",
          explanation: "LLMs already handle grammar fluently from pretraining. The module's point is the opposite: the model sounds fluent while inventing facts, and RAG supplies the missing factual context rather than teaching language."
        },
        {
          letter: "D",
          text: "The model runs out of memory, so RAG compresses its weights",
          explanation: "This mixes RAG up with model compression or quantization. RAG does not touch the model's weights at all; it retrieves relevant document chunks and adds them to the prompt as context."
        }
      ],
      correctIndex: 0
    },
    {
      id: "m05-q2",
      difficulty: "medium",
      type: "mc",
      typeLabel: "Graphic based",
      prompt: "The diagram shows a RAG pipeline at <em>query time</em>. Based on the module, what belongs in the missing <strong>Retrieve</strong> box (step 3)?",
      diagram: "<svg viewBox='0 0 620 240' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='m05arw' markerWidth='9' markerHeight='9' refX='7' refY='3' orient='auto'><path d='M0,0 L7,3 L0,6 Z' fill='#64748b'/></marker></defs><text x='310' y='24' text-anchor='middle' font-size='13' font-weight='700' fill='#1e293b'>RAG Pipeline (Query Time)</text><rect x='16' y='70' width='104' height='60' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='68' y='96' text-anchor='middle' font-size='11' font-weight='600' fill='#1e293b'>1. Query</text><text x='68' y='112' text-anchor='middle' font-size='9' fill='#64748b'>user question</text><line x1='122' y1='100' x2='146' y2='100' stroke='#64748b' stroke-width='1.5' marker-end='url(#m05arw)'/><rect x='148' y='70' width='104' height='60' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='200' y='96' text-anchor='middle' font-size='11' font-weight='600' fill='#1e293b'>2. Embed</text><text x='200' y='112' text-anchor='middle' font-size='9' fill='#64748b'>query -&gt; vector</text><line x1='254' y1='100' x2='278' y2='100' stroke='#64748b' stroke-width='1.5' marker-end='url(#m05arw)'/><rect x='280' y='70' width='104' height='60' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB' stroke-dasharray='5 4'/><text x='332' y='96' text-anchor='middle' font-size='11' font-weight='700' fill='#2563EB'>3. Retrieve</text><text x='332' y='112' text-anchor='middle' font-size='9' fill='#64748b'>?</text><line x1='386' y1='100' x2='410' y2='100' stroke='#64748b' stroke-width='1.5' marker-end='url(#m05arw)'/><rect x='412' y='70' width='104' height='60' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='464' y='96' text-anchor='middle' font-size='11' font-weight='600' fill='#1e293b'>4. Augment</text><text x='464' y='112' text-anchor='middle' font-size='9' fill='#64748b'>add context</text><line x1='518' y1='100' x2='542' y2='100' stroke='#64748b' stroke-width='1.5' marker-end='url(#m05arw)'/><rect x='544' y='70' width='68' height='60' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='578' y='96' text-anchor='middle' font-size='11' font-weight='600' fill='#1e293b'>5. Generate</text><text x='578' y='112' text-anchor='middle' font-size='9' fill='#64748b'>answer</text><text x='310' y='176' text-anchor='middle' font-size='10' fill='#64748b'>vector store: find nearest chunk vectors</text></svg>",
      options: [
        {
          letter: "A",
          text: "Search the vector store for the top-k chunks whose vectors are most similar to the query vector",
          explanation: "Correct: retrieval embeds the query, then the vector store returns the top-k nearest chunks by meaning to use as context."
        },
        {
          letter: "B",
          text: "Fine-tune the LLM's weights on the query so it memorizes the answer",
          explanation: "This treats retrieval as training. RAG never updates the model's weights at query time; the whole appeal is looking information up without any retraining, so retrieval is a similarity search over stored vectors."
        },
        {
          letter: "C",
          text: "Do an exact keyword string match against the raw document text",
          explanation: "That describes keyword search, not semantic retrieval. The module contrasts the two: RAG retrieves by vector similarity so it can match meaning even when the query and chunk share no exact words."
        },
        {
          letter: "D",
          text: "Re-chunk and re-embed the entire document collection from scratch",
          explanation: "Chunking and embedding the corpus happen once during indexing, not per query. At query time only the question is embedded and compared against the already-stored vectors."
        }
      ],
      correctIndex: 0
    },
    {
      id: "m05-q3",
      difficulty: "medium",
      type: "fill",
      typeLabel: "Fill in",
      prompt: "In the module's RAG build, the recommended text splitter is <code>RecursiveCharacterTextSplitter</code>, and Lab 1 chunks the syllabus with a 200-character _______ between neighboring chunks so a sentence at a boundary is not cut in half. What is this shared-region setting called?",
      accept: ["overlap", "chunk overlap", "chunk_overlap", "Overlap"],
      explanation: "The answer is overlap (chunk_overlap). A common wrong guess is 'chunk size', but chunk size sets how big each piece is; overlap is the region two neighboring chunks share so context that straddles a boundary is preserved."
    },
    {
      id: "m05-q4",
      difficulty: "medium",
      type: "mc",
      typeLabel: "Multiple choice",
      prompt: "According to the module, what is the practical difference between chunks that are <strong>too small</strong> and chunks that are <strong>too large</strong>?",
      options: [
        {
          letter: "A",
          text: "Too small loses context; too large dilutes relevance by burying the relevant text",
          explanation: "Correct: tiny chunks can become meaningless fragments, while oversized chunks mix in so much text that the relevant part gets buried."
        },
        {
          letter: "B",
          text: "Too small dilutes relevance; too large loses context",
          explanation: "This reverses the two failure modes. Small chunks lose context because a fragment may not stand on its own, and large chunks dilute relevance because the useful part is buried in surrounding text."
        },
        {
          letter: "C",
          text: "Chunk size has no effect on retrieval quality; only the embedding model matters",
          explanation: "The module treats chunking as one of the most important RAG decisions. Both size and overlap directly shape what the model retrieves, so chunk size very much affects retrieval quality."
        },
        {
          letter: "D",
          text: "Smaller chunks are always better because they cost less to embed",
          explanation: "Cost is not the deciding factor, and smaller is not always better. Chunks that are too small strip away the context needed to answer, which is why the module recommends a balanced size of roughly 500-1000 characters."
        }
      ],
      correctIndex: 0
    },
    {
      id: "m05-q5",
      difficulty: "hard",
      type: "mc",
      typeLabel: "Coding",
      prompt: "This snippet computes the cosine similarity between a query vector and two chunk vectors, then prints which chunk a top-1 retriever would return. What does it print?",
      code: "import math\n\ndef cosine(a, b):\n    dot = sum(x*y for x, y in zip(a, b))\n    na = math.sqrt(sum(x*x for x in a))\n    nb = math.sqrt(sum(y*y for y in b))\n    return dot / (na * nb)\n\nquery = [1, 0, 1]\nchunks = {\"c1\": [1, 0, 0], \"c2\": [1, 1, 1]}\nscores = {k: cosine(query, v) for k, v in chunks.items()}\nbest = max(scores, key=scores.get)\nprint(best, round(scores[best], 3))",
      options: [
        {
          letter: "A",
          text: "c2 0.816",
          explanation: "Correct: cosine(query,c2)=2/(sqrt(2)*sqrt(3))=0.816 beats cosine(query,c1)=1/sqrt(2)=0.707, so c2 wins and it prints 'c2 0.816'."
        },
        {
          letter: "B",
          text: "c1 0.707",
          explanation: "This picks the runner-up. c1 scores 1/sqrt(2)=0.707, but c2 scores 0.816, and max() returns the highest-scoring key, so c1 is not the one printed."
        },
        {
          letter: "C",
          text: "c2 1.0",
          explanation: "A similarity of 1.0 would require the query and chunk to point in exactly the same direction. Here query=[1,0,1] and c2=[1,1,1] differ, giving 0.816, not a perfect 1.0."
        },
        {
          letter: "D",
          text: "c1 1.0",
          explanation: "This wrongly assumes exact vector equality. Neither chunk equals the query, and c1's actual cosine score is 0.707, so it neither wins nor scores 1.0."
        }
      ],
      correctIndex: 0
    }
  ]
};

window.REVIEW = true;
</script>
<script>
/* DADS 5250 quiz engine. Reads window.QUIZ = {meta, questions} and window.REVIEW (bool).
   Mechanics: mc, multi, tf, fill, order. Any question may carry a `code` block or `diagram` (SVG).
   typeLabel carries the pedagogical label (Practical insight, Graphic based, Coding, etc.). */
(function () {
  var Q = window.QUIZ || { meta: {}, questions: [] };
  var REVIEW = !!window.REVIEW;
  var questions = Q.questions || [];
  var meta = Q.meta || {};
  var STORAGE_KEY = 'dads_quiz_' + (meta.module || 'x');

  var state = { idx: 0, answers: questions.map(function () { return { answered: false, correct: false }; }) };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return String(s).trim().toLowerCase().replace(/[^a-z0-9.]/g, ''); }
  function root() { return document.getElementById('quiz-root'); }

  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
  function load() { try { var s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s && s.answers && s.answers.length === questions.length) state = s; } catch (e) {} }

  function diffLabel(d) { return d ? d.charAt(0).toUpperCase() + d.slice(1) : 'Medium'; }
  function visuals(q) {
    var h = '';
    if (q.diagram) h += '<div class="diagram-area">' + q.diagram + '</div>';
    if (q.code) h += '<div class="code-block">' + esc(q.code) + '</div>';
    return h;
  }
  function score() { return state.answers.filter(function (a) { return a.correct; }).length; }

  /* ---------- STUDENT MODE ---------- */
  function renderStudent() {
    var r = root();
    var done = state.answers.every(function (a) { return a.answered; });
    var dots = questions.map(function (q, i) {
      var c = 'progress-dot' + (i === state.idx ? ' active' : '');
      if (state.answers[i].answered) c += state.answers[i].correct ? ' correct' : ' incorrect';
      return '<span class="' + c + '" data-jump="' + i + '"></span>';
    }).join('');
    var head =
      '<div class="score-bar"><span class="score-text">' + score() + ' / ' + questions.length + ' correct</span>' +
      '<span class="page-indicator">' + (done ? 'Review your answers' : 'Question ' + (state.idx + 1) + ' of ' + questions.length) + '</span></div>' +
      '<div class="progress-dots">' + dots + '</div>';
    r.innerHTML = head + '<div id="card"></div>';
    renderCard();
    Array.prototype.forEach.call(r.querySelectorAll('[data-jump]'), function (d) {
      d.onclick = function () { state.idx = +d.getAttribute('data-jump'); renderStudent(); };
    });
  }

  function renderCard() {
    var q = questions[state.idx], a = state.answers[state.idx], card = document.getElementById('card');
    var body =
      '<div class="qmeta"><span class="question-number">Question ' + (state.idx + 1) + '</span>' +
      '<span class="badge">' + esc(q.typeLabel || 'Multiple choice') + '</span>' +
      '<span class="badge diff-' + (q.difficulty || 'medium') + '">' + diffLabel(q.difficulty) + '</span></div>' +
      '<div class="question-prompt">' + q.prompt + '</div>' + visuals(q);

    if (q.type === 'mc' || q.type === 'multi') {
      body += '<div class="options-list">' + q.options.map(function (o, i) {
        return '<button class="option" data-i="' + i + '"><span class="letter">' + o.letter + '</span><span>' + o.text + '</span><span class="mark"></span></button>';
      }).join('') + '</div>';
      if (q.type === 'multi') body += '<div class="submit-row"><button class="btn primary" id="submit">Submit</button><span class="hint" style="margin:0;align-self:center">Select all that apply.</span></div>';
    } else if (q.type === 'tf') {
      body += '<div class="options-list"><button class="option" data-tf="true"><span class="letter">T</span><span>True</span><span class="mark"></span></button>' +
              '<button class="option" data-tf="false"><span class="letter">F</span><span>False</span><span class="mark"></span></button></div>';
    } else if (q.type === 'fill') {
      body += '<input class="fill-input" id="fill" placeholder="Type your answer" autocomplete="off"><div class="submit-row"><button class="btn primary" id="submit">Submit</button></div>';
    } else if (q.type === 'order') {
      body += '<div class="order-list">' + q.items.map(function (it, i) {
        var opts = q.items.map(function (_, j) { return '<option value="' + j + '">' + (j + 1) + '</option>'; }).join('');
        return '<div class="order-item"><span class="num">' + (i + 1) + '</span><span>' + esc(it) + '</span><select data-oi="' + i + '">' + opts + '</select></div>';
      }).join('') + '</div><div class="submit-row"><button class="btn primary" id="submit">Submit</button></div>';
    }
    body += '<div class="feedback" id="fb"></div>';
    body +=
      '<div class="nav-row"><button class="btn" id="prev"' + (state.idx === 0 ? ' disabled' : '') + '>Previous</button>' +
      '<button class="btn primary" id="next"' + (state.idx === questions.length - 1 ? ' disabled' : '') + '>Next</button></div>';
    card.innerHTML = body;

    wire(q, a);
    document.getElementById('prev').onclick = function () { if (state.idx > 0) { state.idx--; renderStudent(); } };
    document.getElementById('next').onclick = function () { if (state.idx < questions.length - 1) { state.idx++; renderStudent(); } };
    if (a.answered) replay(q, a);
  }

  function wire(q, a) {
    if (a.answered) return;
    if (q.type === 'mc') {
      Array.prototype.forEach.call(document.querySelectorAll('.option'), function (b) {
        b.onclick = function () { gradeMC(q, +b.getAttribute('data-i')); };
      });
    } else if (q.type === 'tf') {
      Array.prototype.forEach.call(document.querySelectorAll('.option'), function (b) {
        b.onclick = function () { gradeTF(q, b.getAttribute('data-tf') === 'true'); };
      });
    } else if (q.type === 'multi') {
      Array.prototype.forEach.call(document.querySelectorAll('.option'), function (b) {
        b.onclick = function () { b.classList.toggle('selected'); };
      });
      document.getElementById('submit').onclick = function () {
        var chosen = []; Array.prototype.forEach.call(document.querySelectorAll('.option.selected'), function (b) { chosen.push(+b.getAttribute('data-i')); });
        gradeMulti(q, chosen);
      };
    } else if (q.type === 'fill') {
      document.getElementById('submit').onclick = function () { gradeFill(q, document.getElementById('fill').value); };
    } else if (q.type === 'order') {
      document.getElementById('submit').onclick = function () {
        var ord = []; Array.prototype.forEach.call(document.querySelectorAll('[data-oi]'), function (s) { ord[+s.getAttribute('data-oi')] = +s.value; });
        gradeOrder(q, ord);
      };
    }
  }

  function lockAndFeedback(correct, answerHTML, exp) {
    Array.prototype.forEach.call(document.querySelectorAll('.option'), function (b) { b.classList.add('locked'); });
    var sub = document.getElementById('submit'); if (sub) sub.disabled = true;
    var fill = document.getElementById('fill'); if (fill) fill.disabled = true;
    var fb = document.getElementById('fb');
    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
    fb.innerHTML = '<span class="verdict">' + (correct ? 'Correct.' : 'Not quite.') + '</span>' +
      (answerHTML ? '<div class="answer-line">' + answerHTML + '</div>' : '') +
      (exp ? '<div class="answer-line">' + exp + '</div>' : '');
    state.answers[state.idx] = { answered: true, correct: correct };
    save();
    document.getElementById('next').disabled = state.idx === questions.length - 1;
    // refresh dots
    renderStudentDots();
  }
  function renderStudentDots() {
    var dots = document.querySelectorAll('.progress-dot');
    dots.forEach(function (d, i) {
      d.className = 'progress-dot' + (i === state.idx ? ' active' : '') + (state.answers[i].answered ? (state.answers[i].correct ? ' correct' : ' incorrect') : '');
    });
    var st = document.querySelector('.score-text'); if (st) st.textContent = score() + ' / ' + questions.length + ' correct';
  }

  function gradeMC(q, i) {
    var correct = i === q.correctIndex, opts = document.querySelectorAll('.option');
    opts[i].classList.add(correct ? 'correct' : 'incorrect');
    opts[i].querySelector('.mark').textContent = correct ? '✓' : '✗';
    if (!correct) { opts[q.correctIndex].classList.add('correct'); opts[q.correctIndex].querySelector('.mark').textContent = '✓'; }
    var co = q.options[q.correctIndex], chosen = q.options[i];
    var answer = '<strong>Answer:</strong> ' + co.letter + ') ' + co.text;
    var exp = correct
      ? co.explanation
      : '<strong>Why ' + chosen.letter + ' is wrong:</strong> ' + chosen.explanation +
        '<div class="answer-line"><strong>Why ' + co.letter + ' is right:</strong> ' + co.explanation + '</div>';
    lockAndFeedback(correct, answer, exp);
  }
  function gradeMulti(q, chosen) {
    var want = q.correctIndices.slice().sort().join(','), got = chosen.slice().sort().join(',');
    var correct = want === got, opts = document.querySelectorAll('.option');
    q.correctIndices.forEach(function (ci) { opts[ci].classList.add('correct'); opts[ci].querySelector('.mark').textContent = '✓'; });
    chosen.forEach(function (ci) { if (q.correctIndices.indexOf(ci) < 0) { opts[ci].classList.add('incorrect'); opts[ci].querySelector('.mark').textContent = '✗'; } });
    var letters = q.correctIndices.map(function (ci) { return q.options[ci].letter; }).join(', ');
    var exp;
    if (correct) {
      exp = q.explanation || '';
    } else {
      var parts = [];
      chosen.forEach(function (ci) { if (q.correctIndices.indexOf(ci) < 0) parts.push('<div class="answer-line"><strong>' + q.options[ci].letter + ' should NOT be selected:</strong> ' + q.options[ci].explanation + '</div>'); });
      q.correctIndices.forEach(function (ci) { if (chosen.indexOf(ci) < 0) parts.push('<div class="answer-line"><strong>' + q.options[ci].letter + ' should be selected:</strong> ' + q.options[ci].explanation + '</div>'); });
      exp = parts.join('') + (q.explanation ? '<div class="answer-line">' + q.explanation + '</div>' : '');
    }
    lockAndFeedback(correct, '<strong>Correct set:</strong> ' + letters, exp);
  }
  function gradeTF(q, val) {
    var correct = val === q.correctAnswer, opts = document.querySelectorAll('.option');
    var idx = val ? 0 : 1, cidx = q.correctAnswer ? 0 : 1;
    opts[idx].classList.add(correct ? 'correct' : 'incorrect');
    opts[idx].querySelector('.mark').textContent = correct ? '✓' : '✗';
    if (!correct) { opts[cidx].classList.add('correct'); opts[cidx].querySelector('.mark').textContent = '✓'; }
    lockAndFeedback(correct, '<strong>Answer:</strong> ' + (q.correctAnswer ? 'True' : 'False'), q.explanation);
  }
  function gradeFill(q, val) {
    var correct = (q.accept || []).some(function (a) { return norm(a) === norm(val); });
    lockAndFeedback(correct, '<strong>Answer:</strong> ' + esc(q.accept[0]), q.explanation);
  }
  function gradeOrder(q, ord) {
    var correct = ord.join(',') === q.correctOrder.join(',');
    var right = q.correctOrder.map(function (pos, i) { return (i + 1) + '. ' + q.items[q.correctOrder.indexOf(i)]; });
    // simpler: show correct sequence
    var seq = q.correctOrder.map(function (targetPos, itemIdx) { return null; });
    var ordered = q.items.map(function (_, slot) { var itemIdx = q.correctOrder.indexOf(slot); return (slot + 1) + '. ' + q.items[itemIdx]; }).join('<br>');
    lockAndFeedback(correct, '<strong>Correct order:</strong><br>' + ordered, q.explanation);
  }

  function replay(q, a) {
    // re-show a locked, answered card with the correct answer highlighted
    if (q.type === 'mc' || q.type === 'tf') {
      var opts = document.querySelectorAll('.option');
      var cidx = q.type === 'mc' ? q.correctIndex : (q.correctAnswer ? 0 : 1);
      if (opts[cidx]) { opts[cidx].classList.add('correct', 'locked'); opts[cidx].querySelector('.mark').textContent = '✓'; }
      opts.forEach(function (b) { b.classList.add('locked'); });
    }
    var fb = document.getElementById('fb');
    fb.className = 'feedback show ' + (a.correct ? 'correct' : 'incorrect');
    fb.innerHTML = '<span class="verdict">' + (a.correct ? 'Correct.' : 'Not quite.') + '</span> <span class="answer-line">You have already answered this one.</span>';
    var sub = document.getElementById('submit'); if (sub) sub.disabled = true;
    var fill = document.getElementById('fill'); if (fill) fill.disabled = true;
  }

  /* ---------- REVIEW / ANSWER-KEY MODE ---------- */
  function renderReview() {
    var r = root();
    var html = '<div class="review-banner">Colleague review view. Correct answers and explanations are shown. This is not the student view.</div>';
    questions.forEach(function (q, i) {
      html += '<div class="question-card"><div class="qmeta"><span class="question-number">Question ' + (i + 1) + '</span>' +
        '<span class="badge">' + esc(q.typeLabel || 'Multiple choice') + '</span>' +
        '<span class="badge diff-' + (q.difficulty || 'medium') + '">' + diffLabel(q.difficulty) + '</span></div>' +
        '<div class="question-prompt">' + q.prompt + '</div>' + visuals(q);
      if (q.type === 'mc' || q.type === 'multi') {
        var correctSet = q.type === 'mc' ? [q.correctIndex] : q.correctIndices;
        html += '<div class="options-list">' + q.options.map(function (o, j) {
          var isC = correctSet.indexOf(j) >= 0;
          return '<div class="option locked' + (isC ? ' correct' : '') + '"><span class="letter">' + o.letter + '</span><span>' + o.text + '</span><span class="mark">' + (isC ? '✓' : '') + '</span></div>';
        }).join('') + '</div>';
        html += '<div class="rev-exp">' + q.options.map(function (o, j) {
          return '<div class="opt-exp"><span class="ol">' + o.letter + ')</span> ' + (o.explanation || '') + '</div>';
        }).join('') + '</div>';
      } else if (q.type === 'tf') {
        html += '<div class="rev-answer"><span class="lbl">Answer:</span> ' + (q.correctAnswer ? 'True' : 'False') + '</div><div class="rev-exp">' + q.explanation + '</div>';
      } else if (q.type === 'fill') {
        html += '<div class="rev-answer"><span class="lbl">Answer:</span> ' + esc(q.accept.join(' / ')) + '</div><div class="rev-exp">' + q.explanation + '</div>';
      } else if (q.type === 'order') {
        var ordered = q.items.map(function (_, slot) { var itemIdx = q.correctOrder.indexOf(slot); return (slot + 1) + '. ' + esc(q.items[itemIdx]); }).join('<br>');
        html += '<div class="rev-answer"><span class="lbl">Correct order:</span><br>' + ordered + '</div><div class="rev-exp">' + q.explanation + '</div>';
      }
      html += '</div>';
    });
    r.innerHTML = html;
  }

  function boot() {
    var hdr = document.getElementById('quiz-header');
    if (hdr) hdr.innerHTML = '<div class="eyebrow">' + esc(meta.module || '') + ' quiz</div><h1>' + esc(meta.title || 'Module quiz') + '</h1><div class="subtitle">' + esc(meta.subtitle || 'DADS 5250 Generative AI in Practice') + '</div>';
    if (REVIEW) renderReview(); else { load(); renderStudent(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
