<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>M12 Quiz, M12</title>
<!-- Self-contained single file. Development / review view: shows every question with the correct
     answer and all per-option feedback. Not a student-testing view. Only loads the Outfit web font. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>/* DADS 5250 quiz engine, Liquid Glass theme (lifted from the IE3425 quiz component). */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F0F4FA;
  --accent-blue: #2563EB;
  --glass-bg: rgba(255,255,255,0.45);
  --glass-border: rgba(255,255,255,0.55);
  --glass-shadow: 0 8px 32px rgba(37,99,235,0.08);
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-warm: #64748b;
  --correct: #059669;
  --correct-bg: rgba(34,197,94,0.10);
  --correct-border: rgba(34,197,94,0.35);
  --incorrect: #dc2626;
  --incorrect-bg: rgba(239,68,68,0.09);
  --incorrect-border: rgba(239,68,68,0.32);
  --blue-light: rgba(37,99,235,0.08);
  --blue-medium: rgba(37,99,235,0.12);
  --radius: 20px;
  --radius-sm: 12px;
}

body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  font-weight: 400;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top: -120px; right: -120px; width: 400px; height: 400px;
  border-radius: 50%; background: radial-gradient(circle, rgba(37,99,235,0.07) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.container { max-width: 780px; margin: 0 auto; padding: 32px 24px 72px; position: relative; z-index: 1; }

.quiz-header { text-align: center; margin-bottom: 28px; }
.quiz-header .eyebrow { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent-blue); }
.quiz-header h1 { font-size: 1.75rem; font-weight: 700; margin: 6px 0 4px; }
.quiz-header .subtitle { font-size: 0.95rem; color: var(--text-secondary); }

.review-banner {
  background: rgba(37,99,235,0.10); border: 1px solid rgba(37,99,235,0.28); color: #1e3a8a;
  border-radius: var(--radius-sm); padding: 12px 18px; margin-bottom: 24px; font-weight: 600; font-size: 0.95rem; text-align: center;
}

.score-bar {
  display: flex; align-items: center; justify-content: space-between; background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 14px 24px; margin-bottom: 24px; box-shadow: var(--glass-shadow);
}
.score-bar .score-text { font-weight: 600; font-size: 1rem; }
.score-bar .page-indicator { font-weight: 400; font-size: 0.9rem; color: var(--text-secondary); }

.progress-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
.progress-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(37,99,235,0.15); transition: all 0.3s ease; cursor: pointer; }
.progress-dot.active { background: var(--accent-blue); box-shadow: 0 0 8px rgba(37,99,235,0.35); transform: scale(1.25); }
.progress-dot.correct { background: rgba(34,197,94,0.75); }
.progress-dot.incorrect { background: rgba(239,68,68,0.72); }

.question-card {
  background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 34px 32px;
  box-shadow: var(--glass-shadow); margin-bottom: 22px; animation: fadeIn 0.35s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.qmeta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.question-number { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-blue); }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--blue-medium); color: var(--accent-blue); letter-spacing: 0.03em; }
.badge.diff-easy { background: rgba(34,197,94,0.14); color: #047857; }
.badge.diff-medium { background: rgba(234,179,8,0.16); color: #a16207; }
.badge.diff-hard { background: rgba(239,68,68,0.14); color: #b91c1c; }

.question-prompt { font-size: 1.15rem; font-weight: 500; line-height: 1.55; margin-bottom: 20px; }
.hint { font-size: 0.86rem; color: var(--text-warm); margin-bottom: 18px; }

.diagram-area { display: flex; justify-content: center; margin-bottom: 22px; padding: 16px; background: rgba(255,255,255,0.4); border: 1px solid rgba(37,99,235,0.08); border-radius: 14px; }
.diagram-area svg { max-width: 100%; height: auto; }

.code-block {
  font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 0.9rem; line-height: 1.6;
  background: #0f172a; color: #e2e8f0; border-radius: var(--radius-sm); padding: 18px 20px; margin-bottom: 20px;
  overflow-x: auto; white-space: pre; border: 1px solid rgba(148,163,184,0.25);
}
.code-block .cm { color: #64748b; }

.options-list { display: flex; flex-direction: column; gap: 12px; }
.option {
  display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(37,99,235,0.12); border-radius: 14px;
  padding: 15px 18px; font-size: 1rem; font-family: inherit; color: var(--text-primary);
  cursor: pointer; transition: all 0.25s ease;
}
.option:hover:not(.locked) { border-color: rgba(37,99,235,0.35); background: rgba(37,99,235,0.06); }
.option .letter { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; background: var(--blue-light); color: var(--accent-blue); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }
.option.selected { border-color: rgba(37,99,235,0.5); background: rgba(37,99,235,0.10); }
.option.correct { background: var(--correct-bg); border-color: var(--correct-border); }
.option.correct .letter { background: rgba(34,197,94,0.2); color: var(--correct); }
.option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); }
.option.incorrect .letter { background: rgba(239,68,68,0.18); color: var(--incorrect); }
.option.locked { cursor: default; }
.option .mark { margin-left: auto; font-weight: 700; }
.option.correct .mark { color: var(--correct); }
.option.incorrect .mark { color: var(--incorrect); }

.fill-input { width: 100%; font-family: inherit; font-size: 1rem; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(37,99,235,0.2); background: rgba(255,255,255,0.6); color: var(--text-primary); }
.order-list { display: flex; flex-direction: column; gap: 10px; }
.order-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(37,99,235,0.12); border-radius: 12px; padding: 12px 16px; }
.order-item .num { width: 24px; height: 24px; border-radius: 6px; background: var(--blue-light); color: var(--accent-blue); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
.order-item select { margin-left: auto; font-family: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(37,99,235,0.2); background: #fff; }

.btn { font-family: inherit; font-weight: 600; font-size: 0.95rem; padding: 11px 22px; border-radius: 12px; border: 1px solid rgba(37,99,235,0.25); background: rgba(37,99,235,0.1); color: var(--accent-blue); cursor: pointer; transition: all 0.2s ease; }
.btn:hover { background: rgba(37,99,235,0.18); }
.btn.primary { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
.btn:disabled { opacity: 0.45; cursor: default; }
.submit-row { margin-top: 20px; display: flex; gap: 12px; }

.feedback { margin-top: 20px; padding: 16px 18px; border-radius: 14px; font-size: 0.98rem; line-height: 1.55; display: none; }
.feedback.show { display: block; animation: fadeIn 0.3s ease; }
.feedback.correct { background: var(--correct-bg); border-left: 4px solid var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); border-left: 4px solid var(--incorrect); }
.feedback .verdict { font-weight: 700; }
.feedback.correct .verdict { color: var(--correct); }
.feedback.incorrect .verdict { color: var(--incorrect); }
.feedback .answer-line { margin-top: 6px; }

.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

/* Review mode: everything visible, stacked */
.rev-answer { margin-top: 8px; font-size: 0.95rem; }
.rev-answer .lbl { font-weight: 700; color: var(--correct); }
.rev-exp { margin-top: 10px; padding: 14px 16px; background: rgba(37,99,235,0.06); border-left: 4px solid var(--accent-blue); border-radius: 10px; font-size: 0.94rem; }
.rev-exp .opt-exp { margin: 4px 0; }
.rev-exp .opt-exp .ol { font-weight: 700; }

/* ---- copy-to-clipboard buttons (tiny, reveal on hover) ---- */
.copybtn {
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; margin-left:6px; padding:0; vertical-align:middle;
  border:1px solid rgba(37,99,235,0.22); border-radius:6px; background:rgba(255,255,255,0.75);
  color:#2563EB; cursor:pointer; opacity:0; transition:opacity .15s ease, background .15s ease; flex:0 0 auto;
}
.copywrap:hover > .copybtn, .rev-opt:hover .copybtn, .rev-optfb:hover .copybtn, .question-prompt:hover .copybtn { opacity:.8; }
.copybtn:hover { opacity:1 !important; background:rgba(37,99,235,0.12); }
.copybtn svg { width:12px; height:12px; pointer-events:none; }
.copybtn.copied { color:#059669; border-color:rgba(34,197,94,0.45); background:rgba(34,197,94,0.12); opacity:1; }

/* ---- per-option feedback in the review view ---- */
.rev-opt { margin-bottom:8px; }
.rev-opt .option { margin-bottom:0; }
.rev-optfb { margin:6px 0 14px 34px; font-size:0.92rem; line-height:1.5; color:#475569;
  padding:9px 13px; border-radius:8px; background:rgba(37,99,235,0.05); border-left:3px solid rgba(37,99,235,0.25); }
.rev-optfb.correct { background:rgba(34,197,94,0.08); border-left-color:var(--correct); }
.rev-optfb.wrong   { background:rgba(239,68,68,0.06); border-left-color:var(--incorrect); }
.rev-optfb .lbl { font-weight:700; }
.rev-optfb.correct .lbl { color:var(--correct); }
.rev-optfb.wrong .lbl { color:var(--incorrect); }
.dl-row { display:flex; justify-content:flex-end; margin-bottom:18px; }
.dl-btn { display:inline-flex; align-items:center; gap:8px; font-family:inherit; font-weight:600; font-size:0.92rem;
  padding:10px 16px; border-radius:12px; border:1px solid rgba(37,99,235,0.3); background:rgba(37,99,235,0.1);
  color:#2563EB; text-decoration:none; cursor:pointer; }
.dl-btn:hover { background:rgba(37,99,235,0.18); }
.dl-btn svg { width:15px; height:15px; }

/* ---- single review view: field + copy button layout ---- */
.fieldwrap { display:flex; align-items:flex-start; gap:6px; margin-bottom:0; }
.fieldwrap > .cf, .fieldwrap > .option { flex:1 1 auto; min-width:0; }
.fieldwrap .question-prompt { margin-bottom:0; }
.rev-answer { display:flex; align-items:flex-start; gap:6px; flex-wrap:wrap; margin-top:6px; font-size:0.98rem; }
.rev-answer .cf { flex:1 1 auto; min-width:0; }
.rev-optfb { display:flex; align-items:flex-start; gap:6px; }
.rev-optfb .cf { flex:1 1 auto; min-width:0; }
.copybtn { opacity:0; }
.fieldwrap:hover .copybtn, .rev-optfb:hover .copybtn, .rev-answer:hover .copybtn, .question-card:hover .copybtn { opacity:.5; }
.copybtn:hover { opacity:1 !important; }
</style></head><body>
<div class="container"><div class="quiz-header" id="quiz-header"></div><div id="quiz-root"></div></div>
<script>window.QUIZ = {
  "meta": {
    "module": "M12",
    "title": "AI Platforms: Google A2A & OpenAI Agents SDK",
    "subtitle": "DADS 5250 Generative AI in Practice"
  },
  "questions": [
    {
      "id": "m12-q1",
      "difficulty": "easy",
      "type": "mc",
      "typeLabel": "Multiple choice",
      "prompt": "The module frames Google's <strong>A2A</strong> and the OpenAI Agents SDK as two <em>philosophies</em>. Which pairing does the module use to describe them?",
      "options": [
        {
          "letter": "A",
          "text": "Google thinks in open protocols; OpenAI thinks in an opinionated SDK",
          "explanation": "Correct: Google's A2A is an open standard so any agent can talk to any other, while the OpenAI Agents SDK is a small Python toolkit for building an agent app fast."
        },
        {
          "letter": "B",
          "text": "Google ships a Python SDK; OpenAI publishes an open wire protocol",
          "explanation": "This reverses the two companies. In the module, Google is the one publishing the open A2A protocol and OpenAI is the one shipping the opinionated Python SDK, not the other way around."
        },
        {
          "letter": "C",
          "text": "Both are open protocols governed by the Linux Foundation",
          "explanation": "Only A2A was donated to the Linux Foundation for vendor-neutral governance. The OpenAI Agents SDK is a Python framework, not a foundation-governed protocol, so calling both open protocols is wrong."
        },
        {
          "letter": "D",
          "text": "Both are closed, single-vendor products that cannot interoperate with other tools",
          "explanation": "A2A is explicitly an open spec anyone can implement, and the module stresses interoperability across frameworks. Describing them as closed and non-interoperable contradicts the whole point of the module."
        }
      ],
      "correctIndex": 0
    },
    {
      "id": "m12-q2",
      "difficulty": "medium",
      "type": "multi",
      "typeLabel": "Multiple select",
      "prompt": "According to the module, which statements about a Google <strong>A2A Agent Card</strong> are true? <em>Select all that apply.</em>",
      "options": [
        {
          "letter": "A",
          "text": "It is a JSON document hosted at a well-known URL such as /.well-known/agent.json",
          "explanation": "Correct: the Agent Card is JSON published at a well-known endpoint so any caller can fetch it before sending work."
        },
        {
          "letter": "B",
          "text": "It advertises the agent's name, service URL, skills, and required authentication",
          "explanation": "Correct: those are exactly the fields the module lists, and a calling agent reads them to decide whether this is the right collaborator."
        },
        {
          "letter": "C",
          "text": "It is the actual unit of work one agent sends to another to be processed",
          "explanation": "This confuses the Agent Card with the Task. The Card is a description read during discovery; the Task is the separate structured request that carries the actual work to be done."
        },
        {
          "letter": "D",
          "text": "It must be written in a proprietary binary format that only Google tools can read",
          "explanation": "The module emphasizes A2A rides on boring, proven web tech and the Card is plain JSON any engineer can read. A proprietary binary format contradicts the open, interoperable design."
        }
      ],
      "correctIndices": [
        0,
        1
      ],
      "explanation": "An Agent Card is a JSON 'business card' at a well-known URL that advertises the agent's name, service URL, skills, and auth; the separate Task object carries the real work."
    },
    {
      "id": "m12-q3",
      "difficulty": "medium",
      "type": "mc",
      "typeLabel": "Graphic based",
      "prompt": "The diagram shows the OpenAI Agents SDK execution model. Based on the module, what is the role of the <strong>Runner</strong>?",
      "diagram": "<svg viewBox='0 0 620 240' xmlns='http://www.w3.org/2000/svg' font-family='Outfit, sans-serif'><rect x='16' y='96' width='120' height='52' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='76' y='118' text-anchor='middle' font-size='13' fill='#1e293b' font-weight='600'>Runner</text><text x='76' y='136' text-anchor='middle' font-size='10' fill='#64748b'>run(agent, input)</text><line x1='136' y1='122' x2='210' y2='122' stroke='#64748b' stroke-width='1.5'/><rect x='210' y='96' width='150' height='52' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='285' y='118' text-anchor='middle' font-size='13' fill='#1e293b' font-weight='600'>Agent</text><text x='285' y='136' text-anchor='middle' font-size='10' fill='#64748b'>name + instructions</text><line x1='360' y1='110' x2='452' y2='44' stroke='#64748b' stroke-width='1.5'/><line x1='360' y1='122' x2='452' y2='122' stroke='#64748b' stroke-width='1.5'/><line x1='360' y1='134' x2='452' y2='200' stroke='#64748b' stroke-width='1.5'/><rect x='452' y='20' width='150' height='44' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='527' y='40' text-anchor='middle' font-size='12' fill='#1e293b' font-weight='600'>Tools</text><text x='527' y='55' text-anchor='middle' font-size='10' fill='#64748b'>@function_tool</text><rect x='452' y='100' width='150' height='44' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='527' y='120' text-anchor='middle' font-size='12' fill='#1e293b' font-weight='600'>Handoffs</text><text x='527' y='135' text-anchor='middle' font-size='10' fill='#64748b'>route to specialists</text><rect x='452' y='180' width='150' height='44' rx='8' fill='rgba(37,99,235,0.08)' stroke='#2563EB'/><text x='527' y='200' text-anchor='middle' font-size='12' fill='#1e293b' font-weight='600'>Guardrails</text><text x='527' y='215' text-anchor='middle' font-size='10' fill='#64748b'>input / output checks</text></svg>",
      "options": [
        {
          "letter": "A",
          "text": "It is the execution engine that takes an agent plus an input, drives the tool-calling and handoff loop, and returns the result",
          "explanation": "Correct: the Runner runs the agentic loop end to end so you call one method and read the answer from result.final_output."
        },
        {
          "letter": "B",
          "text": "It is the LLM prompt template that defines the agent's personality and instructions",
          "explanation": "Instructions live on the Agent, not the Runner. The Runner does not define the agent's job description; it executes the loop for whatever agent you hand it."
        },
        {
          "letter": "C",
          "text": "It is the decorator that turns a Python function into a callable tool",
          "explanation": "That decorator is @function_tool, a separate piece. The Runner is the execution engine that drives the loop, not the mechanism that registers tools."
        },
        {
          "letter": "D",
          "text": "It is the safety layer that blocks unsafe requests before the model runs",
          "explanation": "Blocking unsafe input is the job of guardrails, which fail fast before the model runs. The Runner executes the agentic loop; it is not the validation layer."
        }
      ],
      "correctIndex": 0
    },
    {
      "id": "m12-q4",
      "difficulty": "medium",
      "type": "mc",
      "typeLabel": "Multiple choice",
      "prompt": "In the lab's support app, a <strong>Triage</strong> agent lists specialists in <code>handoffs=[...]</code> and routes each request. What makes the module call the handoff the SDK's signature idea?",
      "options": [
        {
          "letter": "A",
          "text": "Routing is decided at runtime: the triage agent reads each request and delegates to the right specialist, all inside one run",

        },
        {
          "letter": "B",
          "text": "It forces you to enumerate every possible request path in advance before running",
          "explanation": "That is the opposite of the module's point. Handoffs exist so you do NOT enumerate every path; routing is chosen at runtime based on the incoming request."

        {
          "letter": "C",
          "text": "It spawns a brand-new Runner and event loop for each specialist agent",
          "explanation": "The whole exchange is one run driven by a single Runner call. Control moves between agents within that run; it does not start a new Runner or event loop per specialist."
        },
        {
          "letter": "D",
          "text": "It merges all specialists into one large do-everything agent for simplicity",
          "explanation": "The module warns that one giant do-everything agent gets brittle fast. Handoffs keep specialists small and separate, with triage routing between them, which is the reverse of merging them."
        }
      ],
      "correctIndex": 0
    },
    {
      "id": 5,
      "difficulty": "hard",
      "type": "mc",
      "typeLabel": "Coding",
      "prompt": "In the OpenAI Agents SDK, what is the correct way to run an agent in code?",
      "code": "agent = Agent(name=\"Helper\", instructions=\"...\", tools=[get_weather])\nresult = await Runner.run(agent, \"What's the weather in Boston?\")\nprint(result.final_output)",
      "options": [
        {
          "letter": "A",
          "text": "Define an Agent with instructions and tools, then call Runner.run(agent, input); the Runner drives the tool and handoff loop and returns result.final_output.",
          "explanation": "Correct: you describe the agent and the Runner executes the whole agentic loop."
        },
        {
          "letter": "B",
          "text": "Manually loop over tool calls and append messages yourself, exactly like the raw Chat Completions API.",
          "explanation": "That is the boilerplate the SDK removes. The Runner handles the call-execute-return loop for you."
        },
        {
          "letter": "C",
          "text": "Agents run automatically as soon as they are imported, so no Runner call is needed.",
          "explanation": "Nothing runs until you invoke the Runner on an agent with an input."
        },
        {
          "letter": "D",
          "text": "Call Runner.train(agent) before the agent can answer.",
          "explanation": "There is no training step; Runner.run executes the agent immediately."
        }
      ],
      "correctIndex": 0
    }
  ]
};

window.CANVAS_ZIP = '../canvas/M12_Canvas.zip';</script>
<script>/* DADS 5250 quiz engine, single DEVELOPMENT / REVIEW view.
   Shows every question fully expanded: prompt, all options with the correct one marked,
   and every per-option feedback comment. Tiny copy button on each field. Optional
   "Download for Canvas" button when window.CANVAS_ZIP is set. Not a student-testing view. */
(function () {
  var Q = window.QUIZ || { meta: {}, questions: [] };
  var questions = Q.questions || [];
  var meta = Q.meta || {};

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function diffLabel(d) { return d ? d.charAt(0).toUpperCase() + d.slice(1) : 'Medium'; }
  function visuals(q) {
    var h = '';
    if (q.diagram) h += '<div class="diagram-area">' + q.diagram + '</div>';
    if (q.code) h += '<div class="code-block">' + esc(q.code) + '</div>';
    return h;
  }
  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  function cb() { return '<button class="copybtn" type="button" title="Copy this field" aria-label="Copy this field">' + COPY_SVG + '</button>'; }
  // wrap arbitrary HTML content as a copyable field followed by a copy button
  function field(html, tag) { tag = tag || 'div'; return '<div class="fieldwrap"><' + tag + ' class="cf">' + html + '</' + tag + '>' + cb() + '</div>'; }
  function metaRow(q, i) {
    return '<div class="qmeta"><span class="question-number">Question ' + (i + 1) + '</span>' +
      '<span class="badge">' + esc(q.typeLabel || 'Multiple choice') + '</span>' +
      '<span class="badge diff-' + (q.difficulty || 'medium') + '">' + diffLabel(q.difficulty) + '</span></div>';
  }
  function dlRow() {
    if (!window.CANVAS_ZIP) return '';
    return '<div class="dl-row"><a class="dl-btn" href="' + window.CANVAS_ZIP + '" download>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      'Download for Canvas (QTI .zip)</a></div>';
  }

  function optionRow(o, isCorrect) {
    var opt = '<div class="option locked' + (isCorrect ? ' correct' : '') + '">' +
      '<span class="letter">' + o.letter + '</span><span class="cf">' + o.text + '</span>' +
      '<span class="mark">' + (isCorrect ? '✓' : '') + '</span></div>';
    return '<div class="fieldwrap">' + opt + cb() + '</div>';
  }
  function optionFb(o, isCorrect) {
    var lbl = isCorrect ? 'Shown if selected (correct):' : 'Shown if selected (wrong):';
    return '<div class="rev-optfb ' + (isCorrect ? 'correct' : 'wrong') + '"><span class="lbl">' + lbl + '</span> <span class="cf">' + (o.explanation || '') + '</span>' + cb() + '</div>';
  }

  function render() {
    var r = document.getElementById('quiz-root');
    var html = dlRow() +
      '<div class="review-banner">Development and review view. Every question shows the correct answer and all per-option feedback. This is not the student-facing quiz.</div>';
    questions.forEach(function (q, i) {
      html += '<div class="question-card">' + metaRow(q, i) +
        '<div class="fieldwrap"><div class="question-prompt cf">' + q.prompt + '</div>' + cb() + '</div>' + visuals(q);
      if (q.type === 'mc' || q.type === 'multi') {
        var correctSet = q.type === 'mc' ? [q.correctIndex] : q.correctIndices;
        html += q.options.map(function (o, j) {
          var isC = correctSet.indexOf(j) >= 0;
          return '<div class="rev-opt">' + optionRow(o, isC) + optionFb(o, isC) + '</div>';
        }).join('');
      } else if (q.type === 'tf') {
        html += '<div class="rev-answer"><span class="lbl">Answer:</span> <span class="cf">' + (q.correctAnswer ? 'True' : 'False') + '</span>' + cb() + '</div>' +
          '<div class="rev-optfb correct"><span class="lbl">Feedback:</span> <span class="cf">' + q.explanation + '</span>' + cb() + '</div>';
      } else if (q.type === 'fill') {
        html += '<div class="rev-answer"><span class="lbl">Accepted answer(s):</span> <span class="cf">' + esc(q.accept.join(' / ')) + '</span>' + cb() + '</div>' +
          '<div class="rev-optfb correct"><span class="lbl">Feedback:</span> <span class="cf">' + q.explanation + '</span>' + cb() + '</div>';
      } else if (q.type === 'order') {
        var ordered = q.items.map(function (_, slot) { var itemIdx = q.correctOrder.indexOf(slot); return (slot + 1) + '. ' + esc(q.items[itemIdx]); }).join('<br>');
        html += '<div class="rev-answer"><span class="lbl">Correct order:</span><br><span class="cf">' + ordered + '</span>' + cb() + '</div>' +
          '<div class="rev-optfb correct"><span class="lbl">Feedback:</span> <span class="cf">' + q.explanation + '</span>' + cb() + '</div>';
      }
      html += '</div>';
    });
    r.innerHTML = html;
  }

  // one delegated handler: copy the .cf field paired with the clicked button
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.copybtn') : null;
    if (!b) return;
    var cf = b.parentElement.querySelector('.cf');
    if (!cf) return;
    var text = cf.innerText || cf.textContent || '';
    var done = function () { b.classList.add('copied'); setTimeout(function () { b.classList.remove('copied'); }, 1100); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
    else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} document.body.removeChild(ta); done(); }
  });

  function boot() {
    var hdr = document.getElementById('quiz-header');
    if (hdr) hdr.innerHTML = '<div class="eyebrow">' + esc(meta.module || '') + ' quiz</div><h1>' + esc(meta.title || 'Module quiz') + '</h1><div class="subtitle">' + esc(meta.subtitle || 'DADS 5250 Generative AI in Practice') + '</div>';
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script></body></html>
